name: Backend CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pm_monitoring_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pm_monitoring_ci
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Run migrations
        run: npm run migrate:up

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  frontend-lint-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend-lint-and-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend (runtime)
        run: docker build --target runtime -t pm-backend:ci backend

      - name: Build backend (migrate)
        run: docker build --target migrate -t pm-migrate:ci backend

      - name: Build frontend
        run: docker build -t pm-frontend:ci frontend

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci
          ADMIN_DEFAULT_PASSWORD: ci-not-used-only-config-check
        run: |
          cp backend/.env.example backend/.env
          docker compose config -q
