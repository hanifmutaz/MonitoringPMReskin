name: E2E (Playwright)

# Belum jadi required check: jalankan manual (Actions -> E2E -> Run workflow)
# sekali dulu; kalau hijau & stabil, baru jadikan required di branch protection.
on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pm_monitoring_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pm_monitoring_e2e
      JWT_SECRET: e2e-secret-not-for-production
      PORT: 4000
      ADMIN_DEFAULT_USERNAME: admin
      ADMIN_DEFAULT_PASSWORD: admin1234567
      E2E_USERNAME: admin
      E2E_PASSWORD: admin1234567

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install (root, backend, frontend)
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Run migrations
        run: npm run migrate:up --prefix backend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
