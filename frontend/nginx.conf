# nginx: serve SPA statis + reverse proxy /api & /uploads ke backend.
# TLS TIDAK diterminasi di sini — taruh Caddy/nginx/LB di depan container ini
# (lihat README "HTTPS"), dan set TRUST_PROXY_HOPS=2 di backend kalau begitu.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Upload Excel master data batasnya 10MB di backend; sisakan headroom.
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
  }

  # File MSW (mock API) ikut ter-copy dari public/ tapi tidak dipakai di production.
  location = /mockServiceWorker.js {
    return 404;
  }

  # Asset ber-hash (vite) aman di-cache lama.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA fallback; index.html jangan di-cache biar deploy baru langsung kepakai.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
